name: docker
on:
  push:
    branches:
      - "main"
jobs:
  test:
    name: Run tests in docker container
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Clean up runner
      run: |
        # Remove Java (JDKs)
        sudo rm -rf /usr/lib/jvm
  
        # Remove .NET SDKs
        sudo rm -rf /usr/share/dotnet
  
        # Remove Swift toolchain
        sudo rm -rf /usr/share/swift
  
        # Remove Haskell (GHC)
        sudo rm -rf /usr/local/.ghcup
  
        # Remove Julia
        sudo rm -rf /usr/local/julia*
  
        # Remove Android SDKs
        sudo rm -rf /usr/local/lib/android
  
        # Remove Chromium (optional if not using for browser tests)
        sudo rm -rf /usr/local/share/chromium
  
        # Remove Microsoft/Edge and Google Chrome builds
        sudo rm -rf /opt/microsoft /opt/google
  
        # Remove Azure CLI
        sudo rm -rf /opt/az
  
        # Remove PowerShell
        sudo rm -rf /usr/local/share/powershell
  
        # Remove CodeQL and other toolcaches
        sudo rm -rf /opt/hostedtoolcache
  
        docker system prune -af || true
        docker builder prune -af || true
        df -h

    - name: Create .env file
      run: cp env .env

    - name: Build docker images
      run: docker compose -f docker-compose.build.yml build

    - name: Tag built image for CPU test run
      run: docker tag computervision:0.0.1 ghcr.io/ccb-hms/computervision:latest

    - name: Run tests
      run: docker compose -f docker-compose.cpu.yml run --rm app python -m pytest

  test-ghcr-image:
    name: Run pytest in published GHCR image
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create .env file
      run: cp env .env

    - name: Create data directory
      run: mkdir -p data

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Pull published image
      run: docker pull ghcr.io/ccb-hms/computervision:latest

    - name: Run tests
      run: |
        docker run --rm \
          --ipc=host \
          --env-file .env \
          -e HF_HOME=/app/data \
          -e TORCH_HOME=/app/data \
          -e DATA_DIR=/app/data \
          -v "${{ github.workspace }}:/app" \
          -v "${{ github.workspace }}/data:/app/data" \
          ghcr.io/ccb-hms/computervision:latest \
          python -m pytest